<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Industrial Rack Editor</title>
<style>

* { box-sizing: border-box; }
body{
    margin:0;
    background:#0f1114;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Segoe UI, sans-serif;
}

/* ===================== PANEL ===================== */

.panel{
    width:1300px;
    padding:0;
    border-radius:6px;
    position:relative;

    background:
        linear-gradient(180deg,#3c4148,#2b3036);

    box-shadow:
        0 25px 40px rgba(0,0,0,.9),
        inset 0 1px 0 rgba(255,255,255,.05);
}

/* brushed metal texture */
.panel::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:6px;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,.015),
            rgba(255,255,255,.015) 1px,
            rgba(0,0,0,.02) 2px
        );
    mix-blend-mode:overlay;
    opacity:.6;
}

/* ===================== HEADER ===================== */

.header{
    height:42px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        linear-gradient(180deg,#3b78d8,#204c8f);

    border-bottom:3px solid rgba(0,0,0,.6);

    box-shadow:
        inset 0 2px 0 rgba(255,255,255,.15),
        inset 0 -4px 8px rgba(0,0,0,.6);
}

.header span{
    letter-spacing:2px;
    font-weight:600;
    color:#dce6ff;
    text-shadow:0 1px 2px black;
}

/* LED housing */
.led{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#1c1c1c;
    box-shadow:
        inset 0 2px 4px black,
        0 1px 1px rgba(255,255,255,.1);
    display:flex;
    justify-content:center;
    align-items:center;
}

.led::after{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:#3aff3a;
    box-shadow:
        0 0 6px #3aff3a,
        0 0 14px #3aff3a;
}

/* ===================== BODY ===================== */

.body{
    padding:40px 40px 45px 40px;
    display:flex;
    gap:70px;
}

/* ===================== KNOB ===================== */

.knob{
    text-align:center;
}

.knob-dial{
    width:82px;
    height:82px;
    border-radius:50%;
    position:relative;

    background:
        radial-gradient(circle at 35% 30%, #777 0%, #333 60%, #1b1b1b 100%);

    box-shadow:
        inset 0 8px 12px rgba(0,0,0,.9),
        inset 0 -4px 6px rgba(255,255,255,.08),
        0 10px 14px rgba(0,0,0,.9);

    border:3px solid #111;
}

/* knob rim bevel */
.knob-dial::before{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.1), rgba(0,0,0,.7));
    z-index:-1;
    box-shadow:
        0 6px 10px rgba(0,0,0,.8);
}

/* indicator notch */
.knob-dial::after{
    content:"";
    position:absolute;
    width:6px;
    height:26px;
    background:#f5f5f5;
    border-radius:3px;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 0 6px rgba(255,255,255,.6);
}

.knob label{
    display:block;
    margin-top:14px;
    font-size:13px;
    letter-spacing:.5px;
    color:#bfc6ce;
}

/* ===================== SCREWS ===================== */

.screw{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 30%, #aaa, #333 70%);
    box-shadow:
        inset 0 1px 2px black,
        0 2px 3px rgba(0,0,0,.6);
}

.screw::after{
    content:"";
    position:absolute;
    width:8px;
    height:2px;
    background:#111;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.screw.tl{ top:10px; left:10px; }
.screw.tr{ top:10px; right:10px; }
.screw.bl{ bottom:10px; left:10px; }
.screw.br{ bottom:10px; right:10px; }

/* ===================== SUBFRAME EDGE ===================== */

.panel::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:6px;
    box-shadow:
        inset 0 0 0 2px rgba(0,0,0,.8),
        inset 0 0 0 4px rgba(255,255,255,.04);
    pointer-events:none;
}

</style>
</head>
<body>

<div class="panel">

    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="header">
        <span>TRANSFORM</span>
        <div class="led"></div>
    </div>

    <div class="body">

        <div class="knob">
            <div class="knob-dial"></div>
            <label>Position</label>
        </div>

        <div class="knob">
            <div class="knob-dial"></div>
            <label>Rotation</label>
        </div>

        <div class="knob">
            <div class="knob-dial"></div>
            <label>Scale</label>
        </div>

    </div>

</div>

</body>
</html>
